<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion Program</title>
    <link rel="stylesheet" href="temperatureConversionProgram.css">
</head>
<body>
    <main>
        <form action="">
            <h1>Temperature Conversion</h1>
            <input type="text" id="textBox">

            <div>
                <input type="radio" id="toFahrenheit" name="temperature">
                <label for="toFahrenheit">Celsius → to Fahrenheit</label>
            </div>

            <div>
                <input type="radio" id="toCelsius" name="temperature">
                <label for="toCelsius">Fahrenheit → to Celsius</label>
            </div>

            <button type="button">Submit</button>
            <p></p>
        </form>
    </main>

    <script src="temperatureConversionProgram.js"></script>
</body>
</html>
