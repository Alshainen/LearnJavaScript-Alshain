<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checked Property</title>
    <link rel="stylesheet" href="checkedProperty.css">
</head>
<body>
    <input class="checkEat" type="checkbox" id="checkEat">
    <label class="checkEat" for="checkEat">Makan</label>

    <div id="mainCheck">
        <label>Pembayaran Menggunakan</label>
        <div id="isiCheck">
            <div>
                <input type="radio" name="bayar" id="visa">
                <label for="visa">Visa</label>
            </div>

            <div>
                <input type="radio" name="bayar" id="pulsa">
                <label for="pulsa">Pulsa</label>
            </div>

            <div>
                <input type="radio" name="bayar" id="paypal">
                <label for="paypal">PayPal</label>
            </div>
        </div>
    </div>
    
    <button type="submit">Submit</button>
    <p id="output"></p>
    <script src="checkedProperty.js"></script>
</body>
</html>
