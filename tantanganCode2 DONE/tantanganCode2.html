<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tantanganCode2</title>
    <link rel="stylesheet" href="tantanganCode2.css">
</head>
<body>
    <main>
        <h1 class="judulWeb">FORM PENDAFTARAN MEMBER</h1>
        <div id="namaContainer">
            <label for="nama">Masukkan Namamu</label>
            <label for="nama" id="warningNama"></label>
            <input type="text" id="nama" placeholder="nama" class="namaInput">
        </div>
        <div id="umurContainer">
            <label for="umur">Masukkan Umurmu</label>
            <label for="umur" id="warningUmur"></label>
            <input type="text" id="umur" placeholder="umur" class="umurInput">
        </div>

        <button type="submit" id="submit">Submit</button>

        <p id="output" class="output"></p>
        <p id="outputTwo" class="output"></p>
    </main>
    <script src="tantanganCode2.js"></script>
</body>
</html>
